name: build

on:
  push:
    branches:
      - master
      - main
    tags:
      - "*"
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version:
          - "32"
          - "32/alpine"
          - "32/alpine-synology"
          - "28"
          - "28/alpine"
          - "24"
          - "24/alpine"
          - "23"
          - "23/alpine"
          - "22"
          - "22/alpine"

    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test Alpine variant metadata
        if: matrix.version == '32/alpine'
        run: bash 32/alpine/tests/workflow.sh

      - name: Prepare build metadata
        id: prepare
        env:
          MATRIX_VERSION: ${{ matrix.version }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          QUAY_NAMESPACE: ${{ secrets.QUAY_NAMESPACE }}
        run: |
          set -euo pipefail

          version_num() {
            echo "$1" | awk -F. '{ printf("%d%03d%03d%03d\n", $1+0, $2+0, $3+0, $4+0); }'
          }

          build_context="${MATRIX_VERSION}"
          use_dev_urandom="0"
          if [[ "${MATRIX_VERSION}" == "32/alpine-synology" ]]; then
            build_context="32/alpine"
            use_dev_urandom="1"
          fi

          if [ ! -d "${build_context}" ]; then
            echo "Directory ${build_context}/ does not exist; skipping."
            echo "build=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # Latest numeric major version among top-level numeric directories
          latest_major="$(
            find . -maxdepth 1 -mindepth 1 -type d -exec basename {} \; \
              | grep -E '^[0-9]+$' \
              | sort -n \
              | tail -n 1 || true
          )"
          [ -n "${latest_major}" ] || latest_major="32"

          platforms="linux/amd64"
          if [[ "${MATRIX_VERSION}" == "32/alpine" || "${MATRIX_VERSION}" == "32/alpine-synology" ]] || \
             { [[ "${MATRIX_VERSION}" != *"alpine"* ]] && [ "$(version_num "${MATRIX_VERSION}")" -ge "$(version_num "0.19")" ]; }; then
            platforms="linux/amd64,linux/arm/v7,linux/arm64"
          fi

          push_enabled="false"
          is_push_event="false"
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            is_push_event="true"
          fi

          repo_slug="$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          repo_name="${repo_slug#*/}"
          ghcr_repo="ghcr.io/${repo_slug}"

          tag_suffixes=()

          if [[ "${MATRIX_VERSION}" == "32/alpine-synology" ]]; then
            bitcoin_version="$(awk -F= '/^ARG BITCOIN_VERSION=/ { print $2; exit }' "${build_context}/Dockerfile")"
            if [[ ! "${bitcoin_version}" =~ ^[0-9]+(\.[0-9]+)+$ ]]; then
              echo "Invalid Bitcoin version in ${build_context}/Dockerfile" >&2
              exit 1
            fi
            if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
              raw_tag="${GITHUB_REF#refs/tags/}"
              if [[ "${raw_tag}" != "${bitcoin_version}" && "${raw_tag}" != "${bitcoin_version}-alpine" && "${raw_tag}" != "${bitcoin_version}-alpine-synology" ]]; then
                echo "Skipping ${MATRIX_VERSION}/ for tag ${raw_tag}"
                echo "build=false" >> "${GITHUB_OUTPUT}"
                exit 0
              fi
              push_enabled="true"
              tag_suffixes+=("${bitcoin_version}-alpine-synology")
            else
              tag_suffixes+=("32-alpine-synology")
              if [[ "${GITHUB_REF}" == "refs/heads/master" || "${GITHUB_REF}" == "refs/heads/main" ]]; then
                push_enabled="true"
              fi
            fi
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            raw_tag="${GITHUB_REF#refs/tags/}"
            if [[ "${raw_tag}" == *-alpine-synology ]]; then
              echo "Skipping ${MATRIX_VERSION}/ for Synology tag ${raw_tag}"
              echo "build=false" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            push_enabled="true"

            # Support both "<ver>-alpine" (e.g. "32.1-alpine") and "<ver>" (e.g. "32.1")
            if [[ "${raw_tag}" == *-alpine ]]; then
              clean_ver="${raw_tag%-alpine}"
              if [[ "${MATRIX_VERSION}" != *"alpine"* ]]; then
                echo "Skipping non-alpine matrix ${MATRIX_VERSION}/ for *-alpine tag ${raw_tag}"
                echo "build=false" >> "${GITHUB_OUTPUT}"
                exit 0
              fi
              target_major="${clean_ver%%.*}"
              matrix_major="${MATRIX_VERSION%%/*}"
              if [ "$(version_num "${target_major}")" -ne "$(version_num "${matrix_major}")" ]; then
                echo "Skipping ${MATRIX_VERSION}/ for tag ${raw_tag}"
                echo "build=false" >> "${GITHUB_OUTPUT}"
                exit 0
              fi
              tag_suffixes+=("${raw_tag}")
            else
              clean_ver="${raw_tag}"
              if [[ "${MATRIX_VERSION}" == *"alpine"* ]]; then
                tag_suffixes+=("${clean_ver}-alpine")
              else
                tag_suffixes+=("${clean_ver}")
              fi
              target_major="${clean_ver%%.*}"
              matrix_major="${MATRIX_VERSION%%/*}"
              if [ "$(version_num "${target_major}")" -ne "$(version_num "${matrix_major}")" ]; then
                echo "Skipping ${MATRIX_VERSION}/ for tag ${raw_tag}"
                echo "build=false" >> "${GITHUB_OUTPUT}"
                exit 0
              fi
            fi
          else
            base_tag="${MATRIX_VERSION/\//-}"
            tag_suffixes+=("${base_tag}")

            matrix_major="${MATRIX_VERSION%%/*}"
            if [ "$(version_num "${matrix_major}")" -ge "$(version_num "${latest_major}")" ]; then
              if [[ "${MATRIX_VERSION}" != *"alpine"* ]]; then
                tag_suffixes+=("latest")
              else
                tag_suffixes+=("alpine")
              fi
            fi

            if [[ "${GITHUB_REF}" == "refs/heads/master" || "${GITHUB_REF}" == "refs/heads/main" ]]; then
              push_enabled="true"
            fi
          fi

          {
            echo "build=true"
            echo "push=${push_enabled}"
            echo "is_push_event=${is_push_event}"
            echo "platforms=${platforms}"
            echo "build_context=${build_context}"
            echo "use_dev_urandom=${use_dev_urandom}"
            echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            printf 'tag_suffixes=%s\n' "${tag_suffixes[*]}"
            echo "ghcr_repo=${ghcr_repo}"
            echo "repo_name=${repo_name}"
          } >> "${GITHUB_OUTPUT}"

      - name: Attempt login to GHCR
        id: ghcr_login
        if: steps.prepare.outputs.build == 'true' && steps.prepare.outputs.push == 'true'
        continue-on-error: true
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Warn if GHCR login failed
        if: steps.prepare.outputs.build == 'true' && steps.prepare.outputs.push == 'true' && steps.ghcr_login.outcome != 'success'
        run: echo "::warning::Skipping ghcr.io push for ${{ matrix.version }} because login failed."

      - name: Attempt login to Docker Hub
        id: dockerhub_login
        if: steps.prepare.outputs.build == 'true' && steps.prepare.outputs.push == 'true'
        continue-on-error: true
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Warn if Docker Hub login failed
        if: steps.prepare.outputs.build == 'true' && steps.prepare.outputs.push == 'true' && steps.dockerhub_login.outcome != 'success'
        run: echo "::warning::Skipping Docker Hub push for ${{ matrix.version }} because DOCKERHUB_USERNAME or DOCKERHUB_TOKEN is missing, expired, or invalid."

      - name: Attempt login to quay.io
        id: quay_login
        if: steps.prepare.outputs.build == 'true' && steps.prepare.outputs.push == 'true'
        continue-on-error: true
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Warn if quay.io login failed
        if: steps.prepare.outputs.build == 'true' && steps.prepare.outputs.push == 'true' && steps.quay_login.outcome != 'success'
        run: echo "::warning::Skipping quay.io push for ${{ matrix.version }} because QUAY_USERNAME or QUAY_TOKEN is missing, expired, or invalid."

      - name: Assemble final image tags
        id: final_tags
        if: steps.prepare.outputs.build == 'true'
        env:
          PUSH_ENABLED: ${{ steps.prepare.outputs.push }}
          GHCR_OK: ${{ steps.ghcr_login.outcome }}
          DOCKERHUB_OK: ${{ steps.dockerhub_login.outcome }}
          QUAY_OK: ${{ steps.quay_login.outcome }}
          GHCR_REPO: ${{ steps.prepare.outputs.ghcr_repo }}
          REPO_NAME: ${{ steps.prepare.outputs.repo_name }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          QUAY_NAMESPACE: ${{ secrets.QUAY_NAMESPACE }}
          TAG_SUFFIXES: ${{ steps.prepare.outputs.tag_suffixes }}
        run: |
          set -euo pipefail

          registries=()
          if [[ "${PUSH_ENABLED}" != "true" ]]; then
            # Dry-run build on PRs or non-default branches: format tags using GHCR namespace
            registries+=("${GHCR_REPO}")
          else
            if [[ "${GHCR_OK}" == "success" ]]; then
              registries+=("${GHCR_REPO}")
            fi
            if [[ "${DOCKERHUB_OK}" == "success" && -n "${DOCKERHUB_USERNAME}" ]]; then
              registries+=("${DOCKERHUB_USERNAME,,}/${REPO_NAME}")
            elif [[ "${DOCKERHUB_OK}" == "success" ]]; then
              echo "::warning::Skipping Docker Hub tag because DOCKERHUB_USERNAME is empty."
            fi
            if [[ "${QUAY_OK}" == "success" && -n "${QUAY_NAMESPACE}" ]]; then
              registries+=("quay.io/${QUAY_NAMESPACE,,}/${REPO_NAME}")
            elif [[ "${QUAY_OK}" == "success" ]]; then
              echo "::warning::Skipping quay.io tag because QUAY_NAMESPACE is empty."
            fi
          fi

          full_tags=()
          for reg in "${registries[@]}"; do
            for sfx in ${TAG_SUFFIXES}; do
              full_tags+=("${reg}:${sfx}")
            done
          done

          if [[ "${PUSH_ENABLED}" == "true" && "${#full_tags[@]}" -eq 0 ]]; then
            echo "::error::Push requested for ${{ matrix.version }}, but no registries authenticated successfully."
            exit 1
          fi

          printf -v joined '%s,' "${full_tags[@]}"
          echo "tags=${joined%,}" >> "${GITHUB_OUTPUT}"
          echo "effective_push=${PUSH_ENABLED}" >> "${GITHUB_OUTPUT}"

      - name: Build Docker image
        if: steps.prepare.outputs.build == 'true'
        env:
          RAW_TAGS: ${{ steps.final_tags.outputs.tags }}
          BUILD_CONTEXT: ${{ steps.prepare.outputs.build_context }}
          USE_DEV_URANDOM: ${{ steps.prepare.outputs.use_dev_urandom }}
        run: |
          set -euo pipefail

          IFS=',' read -r -a tag_arr <<< "${RAW_TAGS}"
          tag_args=()
          build_args=()
          if [[ "${BUILD_CONTEXT}" == "32/alpine" ]]; then
            build_args+=(--build-arg "USE_DEV_URANDOM=${USE_DEV_URANDOM}")
          fi
          for t in "${tag_arr[@]}"; do
            [ -n "$t" ] && tag_args+=(--tag "$t")
          done

          echo "Build date: ${{ steps.prepare.outputs.build_date }}"
          echo "Docker platform: ${{ steps.prepare.outputs.platforms }}"
          echo "Push: ${{ steps.final_tags.outputs.effective_push }}"
          echo "Tags: ${RAW_TAGS}"

          docker buildx build \
            --platform "${{ steps.prepare.outputs.platforms }}" \
            --output "type=image,push=${{ steps.final_tags.outputs.effective_push }}" \
            --progress=plain \
            --build-arg "BUILD_DATE=${{ steps.prepare.outputs.build_date }}" \
            --build-arg "VCS_REF=${GITHUB_SHA::8}" \
            "${build_args[@]}" \
            "${tag_args[@]}" \
            "${BUILD_CONTEXT}/"
